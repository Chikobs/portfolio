<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Dashboard - ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar navbar-custom"><div class="container"><a class="navbar-brand" href="index.html">ShopEase Admin</a><div class="ms-auto d-flex gap-2"><a class="nav-link" href="index.html">View Store</a><a class="nav-link" href="logout.html">Logout</a></div></div></nav>
<div class="container py-4"><h3 class="fw-bold text-primary">Admin Dashboard</h3><div class="row g-3 mt-2"><div class="col-md-3"><div class="card p-3 text-center shadow-sm border-0" style="border-top:4px solid #0d6efd"><div class="fs-3 fw-bold text-primary" id="totalProducts">8</div><div class="small">Products</div></div></div><div class="col-md-3"><div class="card p-3 text-center shadow-sm border-0" style="border-top:4px solid #198754"><div class="fs-3 fw-bold text-success" id="totalOrders">0</div><div class="small">Orders</div></div></div><div class="col-md-3"><div class="card p-3 text-center shadow-sm border-0" style="border-top:4px solid #ffc107"><div class="fs-3 fw-bold" id="totalUsers">0</div><div class="small">Customers</div></div></div><div class="col-md-3"><div class="card p-3 text-center shadow-sm border-0" style="border-top:4px solid #dc3545"><div class="fs-3 fw-bold text-danger" id="lowStock">0</div><div class="small">Low Stock</div></div></div></div>
<div class="row g-4 mt-4"><div class="col-lg-6"><div class="card shadow-sm border-0"><div class="card-header bg-primary text-white fw-bold">Recent Orders</div><div class="card-body" id="adminOrders"></div></div></div><div class="col-lg-6"><div class="card shadow-sm border-0"><div class="card-header bg-white fw-bold border-bottom border-primary border-2">Product Images & Stock</div><div class="card-body" id="adminProducts"></div></div></div></div></div>
<script>
let orders=JSON.parse(localStorage.getItem('ec_orders')||'[]');let users=JSON.parse(localStorage.getItem('ec_users')||'[]');
document.getElementById('totalOrders').innerText=orders.length;document.getElementById('totalUsers').innerText=users.length;
const prods=[{name:"Headphone",stock:20,img:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=100"},{name:"Smart Watch",stock:15,img:"https://images.unsplash.com/photo-1579586337278-3befd40fd17b?w=100"},{name:"Shoes",stock:5,img:"https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=100"},{name:"Handbag",stock:12,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=100"}];
document.getElementById('lowStock').innerText=prods.filter(p=>p.stock<10).length;
document.getElementById('adminOrders').innerHTML=orders.length?orders.slice(0,5).map(o=>`<div class="d-flex justify-content-between small py-2 border-bottom"><span>${o.id} - $${o.total}</span><span class="badge bg-light text-dark border">${o.date}</span></div>`).join(''):'<div class="small text-muted">No orders</div>';
document.getElementById('adminProducts').innerHTML=prods.map(p=>`<div class="d-flex gap-2 align-items-center py-2 border-bottom"><img src="${p.img}" style="width:50px;height:50px;object-fit:cover" class="rounded"><div class="flex-grow-1"><div class="fw-bold small">${p.name}</div><div class="small ${p.stock<10?'text-danger':''}">${p.stock} in stock ${p.stock<10?'(Low Stock Alert!)':''}</div></div></div>`).join('');
</script></body></html>
