<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css">
<style>.shop-layout{display:flex;gap:20px}.shop-sidebar{width:280px;background:white;border-radius:14px;padding:20px;border:2px solid #e0eaff;height:fit-content;position:sticky;top:90px}.shop-main{flex:1}@media(max-width:991px){.shop-layout{flex-direction:column}.shop-sidebar{width:100%;position:static}}</style>
</head><body>
<nav class="navbar navbar-expand-lg navbar-custom sticky-top"><div class="container"><a class="navbar-brand" href="index.html">ShopEase</a><div class="ms-auto d-flex gap-3"><a class="nav-link" href="index.html">Home</a><a class="nav-link active" href="shop.html">Shop</a><a class="nav-link" href="cart.html">Cart <span class="badge bg-danger" id="cartCount">0</span></a><a class="nav-link" href="admin.html">Admin</a></div></div></nav>
<div class="container py-4"><h3 class="fw-bold text-primary">Shop Mall - All Products</h3>
<div class="shop-layout mt-3">
<div class="shop-sidebar">
<h6 class="fw-bold">Filters</h6>
<input id="searchInput" class="form-control form-control-sm mt-2" placeholder="Search..."><button class="btn btn-primary btn-sm w-100 mt-2" onclick="searchProducts()">Search</button>
<div class="mt-4 fw-bold small">Categories</div>
<div class="form-check mt-2"><input class="form-check-input" type="radio" name="cat" checked onclick="filterCat('all')"><label class="form-check-label">All</label></div>
<div class="form-check"><input class="form-check-input" type="radio" name="cat" onclick="filterCat('Electronics')"><label>Electronics</label></div>
<div class="form-check"><input class="form-check-input" type="radio" name="cat" onclick="filterCat('Fashion')"><label>Fashion</label></div>
<div class="form-check"><input class="form-check-input" type="radio" name="cat" onclick="filterCat('Groceries')"><label>Groceries</label></div>
<div class="form-check"><input class="form-check-input" type="radio" name="cat" onclick="filterCat('Accessories')"><label>Accessories</label></div>
<div class="mt-4"><label class="small fw-bold">Sort</label><select id="sortSelect" class="form-select form-select-sm mt-1" onchange="sortProducts()"><option value="default">Default</option><option value="low">Low to High</option><option value="high">High to Low</option></select></div>
<div class="alert alert-primary small mt-4"><i class="bi bi-info-circle"></i> Products module + Categories module + Product Images</div>
</div>
<div class="shop-main"><div class="row g-3" id="productGrid"></div></div>
</div></div>
<div class="offcanvas offcanvas-end offcanvas-cart" id="cartOffcanvas"><div class="offcanvas-header"><h5>Cart (<span id="cartCount2">0</span>)</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body"><div id="cartItems"></div><div id="emptyCart" class="text-center py-5">Empty</div><div id="cartFooter" class="d-none"><hr><span id="cartTotal">$0</span><a href="cart.html" class="btn btn-primary w-100 mt-2">Checkout</a></div></div></div>
<div class="modal fade" id="productModal"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 id="modalName"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body row"><div class="col-md-6"><img id="modalImg" class="img-fluid"></div><div class="col-md-6"><h4 id="modalPrice" class="text-primary"></h4><p id="modalDesc"></p><button id="modalAddBtn" class="btn btn-primary w-100">Add to Cart</button></div></div></div></div></div>
<div style="position:fixed;bottom:20px;right:20px;z-index:9999"><div id="liveToast" class="toast text-bg-primary"><div class="d-flex"><div class="toast-body" id="toastMsg"></div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="script.js"></script></body></html>
