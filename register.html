<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register - ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar navbar-custom"><div class="container"><a class="navbar-brand" href="index.html">ShopEase</a><div class="ms-auto"><a class="nav-link" href="login.html">Already have account? Login</a></div></div></nav>
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh"><div class="card shadow-sm border-0 p-4" style="max-width:500px;width:100%;border-radius:16px;border-top:4px solid #0d6efd!important"><h4 class="fw-bold text-primary">Customer Registration</h4><p class="small text-muted">Project 11 - Module 1</p><div class="mt-3"><input id="regName" class="form-control mb-3" placeholder="Full Name"><input id="regEmail" class="form-control mb-3" placeholder="Email"><input id="regPhone" class="form-control mb-3" placeholder="Phone"><input id="regPass" type="password" class="form-control mb-3" placeholder="Password"><button class="btn btn-primary w-100 py-2" onclick="register()">Create Account</button><div class="text-center small mt-3"><a href="login.html">Already registered? Login</a> | <a href="index.html">Home</a></div></div></div></div>
<script>
function register(){const name=document.getElementById('regName').value,email=document.getElementById('regEmail').value,phone=document.getElementById('regPhone').value,pass=document.getElementById('regPass').value;if(!name||!email||!pass){alert('Fill all');return;}let users=JSON.parse(localStorage.getItem('ec_users')||'[]');users.push({name,email,phone,pass});localStorage.setItem('ec_users',JSON.stringify(users));localStorage.setItem('ec_currentUser',JSON.stringify({name,email}));alert('Account created!');window.location.href='index.html';}
</script></body></html>
