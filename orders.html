<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Orders - ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar navbar-custom"><div class="container"><a class="navbar-brand" href="index.html">ShopEase</a><div class="ms-auto d-flex gap-3"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="shop.html">Shop</a><a class="nav-link active" href="orders.html">Orders</a><a class="nav-link" href="cart.html">Cart</a></div></div></nav>
<div class="container py-4" style="max-width:900px"><h3 class="fw-bold text-primary">Order History</h3><p class="small text-muted">Project 11 - Module: Order History</p><div id="ordersList" class="mt-4"></div></div>
<script>
let orders=JSON.parse(localStorage.getItem('ec_orders')||'[]');const cont=document.getElementById('ordersList');if(orders.length===0){cont.innerHTML='<div class="card p-5 text-center shadow-sm border-0"><i class="bi bi-receipt fs-1"></i><p>No orders yet</p><a href="shop.html" class="btn btn-primary">Start Shopping</a></div>';}else{cont.innerHTML=orders.map(o=>`<div class="card mb-3 shadow-sm border-0" style="border-left:4px solid #0d6efd!important"><div class="card-body"><div class="d-flex justify-content-between"><span class="fw-bold">${o.id}</span><span class="badge bg-success">${o.status}</span></div><div class="small text-muted">${o.date}</div><div class="mt-2">${o.items.map(i=>`<div class="small d-flex justify-content-between"><span>${i.name} x ${i.qty}</span><span>$${i.price*i.qty}</span></div>`).join('')}</div><hr><div class="d-flex justify-content-between fw-bold"><span>Total</span><span class="text-primary">$${o.total}</span></div></div></div>`).join('');}
</script></body></html>
