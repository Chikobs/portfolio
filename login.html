<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar navbar-custom"><div class="container"><a class="navbar-brand" href="index.html">ShopEase</a><div class="ms-auto"><a class="nav-link" href="register.html">Need account? Register</a></div></div></nav>
<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh"><div class="card shadow-sm border-0 p-4" style="max-width:450px;width:100%;border-radius:16px;border-top:4px solid #0d6efd!important"><h4 class="fw-bold text-primary">Customer Login</h4><p class="small">Login to view orders & checkout</p><div class="mt-3"><input id="logEmail" class="form-control mb-3" placeholder="Email" value="demo@shopease.com"><input id="logPass" type="password" class="form-control mb-3" placeholder="Password" value="123456"><button class="btn btn-primary w-100 py-2" onclick="login()">Login</button><div id="loginMsg" class="small mt-3 text-center"></div><div class="text-center small mt-3"><a href="register.html">Create account</a> | <a href="index.html">Home</a></div></div></div></div>
<script>
function login(){const email=document.getElementById('logEmail').value;if(!email){alert('Enter email');return;}localStorage.setItem('ec_currentUser',JSON.stringify({name:email.split('@')[0],email:email}));document.getElementById('loginMsg').innerHTML='<div class="alert alert-success">Logged in as '+email+' - <a href="index.html">Go Home</a> | <a href="logout.html">Logout</a></div>';}
</script></body></html>
