<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cart - ShopEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<nav class="navbar navbar-custom"><div class="container"><a class="navbar-brand" href="index.html">ShopEase</a><div class="ms-auto d-flex gap-3"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="shop.html">Shop</a><a class="nav-link active" href="cart.html">Cart <span class="badge bg-danger" id="cartCount">0</span></a><a class="nav-link" href="orders.html">Orders</a></div></div></nav>
<div class="container py-4" style="max-width:1000px"><h3 class="fw-bold text-primary"><i class="bi bi-cart3"></i> Shopping Cart</h3>
<div class="row mt-4 g-4"><div class="col-lg-8"><div class="card border-0 shadow-sm" style="border-radius:14px"><div class="card-body"><div id="cartPageItems"></div><div id="emptyCartPage" class="text-center py-5"><i class="bi bi-cart-x fs-1 text-muted"></i><p>Cart empty</p><a href="shop.html" class="btn btn-primary">Go to Shop</a></div></div></div></div>
<div class="col-lg-4"><div class="card border-0 shadow-sm p-3" style="border-radius:14px"><h6 class="fw-bold">Order Summary</h6><div class="d-flex justify-content-between small mt-3"><span>Subtotal</span><span id="cartPageTotal">$0</span></div><div class="d-flex justify-content-between small"><span>Delivery</span><span class="text-success">Free</span></div><hr><div class="d-flex justify-content-between fw-bold"><span>Total</span><span id="cartPageTotal2">$0</span></div><button class="btn btn-primary w-100 mt-3" onclick="checkout()" style="padding:12px">Proceed to Checkout</button><div class="small text-muted mt-2 text-center"><i class="bi bi-shield-check"></i> Secure checkout - Project 11 module</div></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="script.js"></script>
<script>
function renderCartPage(){let cart=JSON.parse(localStorage.getItem('ec_cart')||'[]');document.getElementById('cartCount').innerText=cart.reduce((s,c)=>s+c.qty,0);const cont=document.getElementById('cartPageItems'),emp=document.getElementById('emptyCartPage');if(cart.length===0){cont.innerHTML='';emp.classList.remove('d-none');document.getElementById('cartPageTotal').innerText='$0';document.getElementById('cartPageTotal2').innerText='$0';return;}emp.classList.add('d-none');cont.innerHTML=cart.map(c=>`<div class="d-flex gap-3 py-3 border-bottom"><img src="${c.img}" style="width:90px;height:90px;object-fit:contain" class="border rounded"><div class="flex-grow-1"><div class="fw-bold">${c.name}</div><div class="small text-muted">${c.cat}</div><div class="fw-bold text-primary mt-1">$${c.price}</div><div class="mt-2"><button class="btn btn-sm border" onclick="changePage(${c.id},-1)">-</button><span class="px-3 fw-bold">${c.qty}</span><button class="btn btn-sm border" onclick="changePage(${c.id},1)">+</button><button class="btn btn-sm btn-outline-danger ms-3" onclick="removePage(${c.id})">Remove</button></div></div><div class="fw-bold">$${c.price*c.qty}</div></div>`).join('');const total=cart.reduce((s,c)=>s+c.price*c.qty,0);document.getElementById('cartPageTotal').innerText='$'+total;document.getElementById('cartPageTotal2').innerText='$'+total;}
function changePage(id,d){let cart=JSON.parse(localStorage.getItem('ec_cart')||'[]');let it=cart.find(c=>c.id===id);it.qty+=d;if(it.qty<=0)cart=cart.filter(c=>c.id!==id);localStorage.setItem('ec_cart',JSON.stringify(cart));renderCartPage();}
function removePage(id){let cart=JSON.parse(localStorage.getItem('ec_cart')||'[]');cart=cart.filter(c=>c.id!==id);localStorage.setItem('ec_cart',JSON.stringify(cart));renderCartPage();}
function checkout(){let cart=JSON.parse(localStorage.getItem('ec_cart')||'[]');if(cart.length===0)return;let orders=JSON.parse(localStorage.getItem('ec_orders')||'[]');const total=cart.reduce((s,c)=>s+c.price*c.qty,0);orders.unshift({id:'ORD'+Date.now(),date:new Date().toLocaleString(),items:[...cart],total:total,status:'Paid'});localStorage.setItem('ec_orders',JSON.stringify(orders));localStorage.removeItem('ec_cart');alert('Order placed!');window.location.href='orders.html';}
renderCartPage();
</script></body></html>
